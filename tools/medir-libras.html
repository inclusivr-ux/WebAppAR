<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Medir os vídeos de LIBRAS</title>
<!--
  Usada por tools/medir-libras.mjs (não abra direto): recebe a lista de
  quadros de um vídeo, passa cada quadro pelo reconhecimento de mãos
  (MediaPipe Hand Landmarker, o mesmo do app) e devolve os 21 pontos de cada
  mão e as notas das vogais em window.__medir(frames).
-->
</head>
<body>
<script type="module">
import { FilesetResolver, HandLandmarker } from '/inclusiapp/vendor/mediapipe/vision_bundle.mjs';
import { classifyHand } from '/inclusiapp/src/sign/handSigns.js';

const fileset = await FilesetResolver.forVisionTasks('/inclusiapp/vendor/mediapipe/wasm');
const landmarker = await HandLandmarker.createFromOptions(fileset, {
  baseOptions: { modelAssetPath: '/inclusiapp/vendor/mediapipe/hand_landmarker.task', delegate: 'CPU' },
  runningMode: 'IMAGE',
  numHands: 2,
  minHandDetectionConfidence: 0.4,
  minHandPresenceConfidence: 0.4,
});

const load = (src) => new Promise((ok, fail) => {
  const img = new Image();
  img.onload = () => ok(img);
  img.onerror = () => fail(new Error(src));
  img.src = src;
});

window.__medir = async (frames) => {
  const out = [];
  for (const { t, src } of frames) {
    const img = await load(src);
    const r = landmarker.detect(img);
    const hands = (r.landmarks || []).map((points, i) => {
      const c = classifyHand(r.worldLandmarks[i]);
      return {
        side: r.handedness?.[i]?.[0]?.categoryName || '',
        points: points.map((p) => [+p.x.toFixed(4), +p.y.toFixed(4)]),
        world: r.worldLandmarks[i].map((p) => [+p.x.toFixed(4), +p.y.toFixed(4), +p.z.toFixed(4)]),
        vowel: c?.vowel || null,
        scores: c ? Object.fromEntries(Object.entries(c.scores).map(([k, v]) => [k, +v.toFixed(2)])) : null,
      };
    });
    out.push({ t, hands });
  }
  return out;
};
window.__pronto = true;
</script>
</body>
</html>
