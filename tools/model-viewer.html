<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualizador de modelos — SinalizaAção</title>
<!--
  Ferramenta de desenvolvimento: confere os animais (.glb do inclusivr-animais)
  com o mesmo carregador do app (src/ar/modelManager.js): material do arquivo,
  decodificador meshopt e as animações gravadas.
  Sirva a RAIZ do repositório (npm start) e abra /tools/model-viewer.html
  Parâmetros: ?names=abelha,urso  &clip=feliz  &t=1.3 (instante)  &cell=300  &bg=e6f0dc
-->
<style>
  body { margin: 0; background: #e6f0dc; color: #42433a; font: 13px system-ui, sans-serif; }
  .label { position: absolute; padding: 2px 6px; background: #fff8; border-radius: 4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from '../inclusiapp/src/lib/three.js';
import { ANIMALS } from '../inclusiapp/src/config.js';
import { createAnimal } from '../inclusiapp/src/ar/modelManager.js';

const params = new URLSearchParams(location.search);
const names = (params.get('names') || 'abelha,elefante,iguana,onca,urso').split(',');
const cell = +(params.get('cell') || 300);
const clip = params.get('clip') || '';
const time = +(params.get('t') || 0);
const bg = params.get('bg');
const views = [['frente', [0, 0.45, 2.1]], ['3/4', [1.4, 0.9, 1.5]], ['lado', [2.1, 0.45, 0]]];
const W = cell * views.length;
const H = cell * names.length;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: !bg, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setSize(W, H);
renderer.setScissorTest(true);

const entries = [];
for (const name of names) {
  const animal = ANIMALS.find((a) => a.id === name.replace('_lagoa', '')) || { id: name };
  const model = await createAnimal(animal, { url: `../inclusiapp/assets/models/${name}.glb` });
  if (clip) {
    const action = model.mixer.clipAction(model.clips.get(clip));
    model.mixer.stopAllAction();
    action.play();
  }
  model.mixer.update(time || 0.001);
  const scene = new THREE.Scene();
  if (bg) scene.background = new THREE.Color(`#${bg}`);
  model.root.position.y = -0.4;
  scene.add(model.root);
  entries.push({ name, scene, model });
}

function draw() {
  entries.forEach(({ scene }, r) => views.forEach(([, pos], c) => {
    const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 50);
    cam.position.set(...pos);
    cam.lookAt(0, 0.02, 0);
    const x = c * cell;
    const y = H - (r + 1) * cell;
    renderer.setViewport(x, y, cell, cell);
    renderer.setScissor(x, y, cell, cell);
    renderer.render(scene, cam);
  }));
}
draw();
entries.forEach(({ name, model }, r) => views.forEach(([label], c) => {
  const d = document.createElement('div');
  d.className = 'label';
  d.textContent = `${name} — ${label} — ${[...model.clips.keys()].join(', ')}`;
  d.style.left = `${c * cell + 4}px`;
  d.style.top = `${r * cell + 4}px`;
  document.body.appendChild(d);
}));
window.__READY__ = true;
</script>
</body>
</html>
