<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Foto de um animal — SinalizaAção</title>
<!--
  Ferramenta de desenvolvimento (tools/render-instrucoes.mjs): fotografa UM
  animal do app (o mesmo .glb e o mesmo carregador do app), com fundo
  transparente, para as imagens de instruções. Nada de IA: é o modelo do
  traço do Igor (repositório inclusivr-animais) renderizado pelo three.js.
  Parâmetros: ?name=elefante &clip=feliz &t=0.4 &az=35 &el=14 &w=520 &h=440 &zoom=1
-->
<style>html, body { margin: 0; background: transparent; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from '../inclusiapp/src/lib/three.js';
import { ANIMALS } from '../inclusiapp/src/config.js';
import { createAnimal } from '../inclusiapp/src/ar/modelManager.js';

const q = new URLSearchParams(location.search);
const name = q.get('name') || 'elefante';
const clip = q.get('clip') || '';
const time = +(q.get('t') || 0);
const az = THREE.MathUtils.degToRad(+(q.get('az') || 35));
const el = THREE.MathUtils.degToRad(+(q.get('el') || 14));
const W = +(q.get('w') || 520);
const H = +(q.get('h') || 440);
const zoom = +(q.get('zoom') || 1);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(1);
renderer.setSize(W, H);

const animal = ANIMALS.find((a) => a.id === name);
const model = await createAnimal(animal, { url: `../inclusiapp/${animal.model}` });
model.shadow.visible = q.get('sombra') === '1';
if (clip) {
  model.mixer.stopAllAction();
  model.mixer.clipAction(model.clips.get(clip)).play();
}
model.mixer.update(time || 0.001);
const scene = new THREE.Scene();
scene.add(model.root);
// enquadra o animal inteiro (a maior medida do .glb = 1)
const box = new THREE.Box3().setFromObject(model.scene);
const center = box.getCenter(new THREE.Vector3());
const size = box.getSize(new THREE.Vector3()).length();
const cam = new THREE.PerspectiveCamera(26, W / H, 0.01, 50);
const dist = (size / 2) / Math.tan(THREE.MathUtils.degToRad(13)) / zoom;
cam.position.set(center.x + dist * Math.cos(el) * Math.sin(az), center.y + dist * Math.sin(el), center.z + dist * Math.cos(el) * Math.cos(az));
cam.lookAt(center);
renderer.render(scene, cam);
window.__READY__ = true;
</script>
</body>
</html>
